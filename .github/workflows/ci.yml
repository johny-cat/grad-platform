# Automatic checks for every pull request and every push to main.
#
# Runs the same commands as on a computer (see CLAUDE.md): install, code
# checks, build, and the database tests on a throwaway Postgres. It never
# touches the live site or the live database.
#
# Actions are pinned to exact commits so an outside change can't alter what
# runs. To update one, replace the commit and the version comment together.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Check, build and test database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Check the code
        run: npm run check

      - name: Build the site
        run: npm run build

      # ubuntu-latest has Postgres server binaries in /usr/lib/postgresql/*/bin,
      # which scripts/test-db.sh finds by itself.
      - name: Test the database rules
        run: npm run test:db
