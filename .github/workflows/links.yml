# Checks that every program's official links still open (see
# scripts/check-program-links.mjs). Runs on pull requests that change program
# files, every Monday, and on demand. It reads public web pages only; it never
# touches the live site or the database.
#
# Actions are pinned to exact commits, as in ci.yml.

name: Program links

on:
  pull_request:
    paths:
      - 'src/data/programs/**'
      - 'scripts/check-program-links.mjs'
      - '.github/workflows/links.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check program links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Open every official program link
        run: node scripts/check-program-links.mjs
