# Checks that every program's official links still open (see
# scripts/check-program-links.mjs). Runs on pull requests that change program
# files, every Monday, and on demand. It reads public web pages only; it never
# touches the live site or the database. On a pull request it also posts the
# results as a comment, so they can be read without opening the run.
#
# Actions are pinned to exact commits, as in ci.yml.

name: Program links

on:
  pull_request:
    paths:
      - 'src/data/programs/**'
      - 'scripts/check-program-links.mjs'
      - '.github/workflows/links.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check program links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Only to post the results comment on the pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Open every official program link
        run: node scripts/check-program-links.mjs
        env:
          LINK_REPORT: ${{ runner.temp }}/link-report.md

      # Pull requests from forks get a read-only token, so this only runs for
      # branches of this repository. It updates the same comment on each run.
      - name: Post the results on the pull request
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPORT: ${{ runner.temp }}/link-report.md
        run: |
          if [ ! -f "$REPORT" ]; then echo "No report was written."; exit 0; fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT" --edit-last --create-if-none
